services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hanger_warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - hanger-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hanger_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hanger-postgres:
